name: Electrical design checker tests

on:
  push:
    paths:
      - "electrical-engineering/design-checker/**"
      - ".github/workflows/design-checker-tests.yml"
  pull_request:
    paths:
      - "electrical-engineering/design-checker/**"
      - ".github/workflows/design-checker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: electrical-engineering/design-checker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q src app.py tests

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
